name: receivables_analytics_app
version: 0.2.0
config-version: 2
profile: receivables_analytics_app

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Load-time cutoff for payments, to simulate a first load followed by an incremental run.
  load_cutoff: "9999-12-31 00:00:00"
  # Re-read applications loaded this many days before the newest load (out-of-order loads).
  lookback_days: 3
  tolerance: 0.005

models:
  receivables_analytics_app:
    staging:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
