version: 2
models:
- name: stg_bronze__customers
  columns:
  - name: customer_id
    data_tests:
    - unique
    - not_null
- name: stg_bronze__invoices
  columns:
  - name: invoice_id
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_bronze__customers')
          field: customer_id
- name: stg_bronze__payments
  columns:
  - name: payment_id
    data_tests:
    - unique
    - not_null
  - name: invoice_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_bronze__invoices')
          field: invoice_id
